source: >-
  Field-by-field observation of the live JSON returned by
  https://everlit.audio/embeds/artl_9QemEuv4WkQ.json and
  https://everlit.audio/oembed?url=... — 2026-08-20. No OpenAPI or JSON Schema exists to derive
  from; every field and every id prefix below was read off a real HTTP 200 response.
scope: >-
  This is the PLAYER-FACING projection only. It is not Everlit's full domain model — the
  authoring, monetization, campaign and analytics objects described in llms-full.txt sit behind
  the Studio login and the undocumented REST API and were not observable.

