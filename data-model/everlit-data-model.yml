observations:
- field: auth_key
  note: >-
    The base64 payload of the signed playback token decodes to a JSON object containing
    user_tag, session_tag, an integer article_id, a channel string ("embedded_article") and an
    integer ad_context — exposing Everlit's internal article primary key and ad-context id
    alongside the public prefixed id. Recorded as an observation, not a vulnerability claim: the
    token is HMAC-signed and the values are not secrets.
