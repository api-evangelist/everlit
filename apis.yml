- name: Everlit REST API
  description: >-
    Everlit markets a REST API for connecting a custom CMS or platform that has no native
    integration — "our REST API makes it possible to connect Everlit to any platform" — and its
    WordPress plugin is configured with an Everlit API key. Nothing about it is published: no
    developer portal, no reference, no base URL, no header or key format, no scopes, no rate
    limits, no error reference and no machine-readable contract. Access runs through sales at
    hello@everlit.audio. Recorded here because the surface is real and vendor-asserted, not
    because it is consumable.
  humanURL: https://everlit.audio/faq
  baseURL: https://everlit.audio
