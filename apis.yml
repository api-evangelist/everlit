aid: everlit
name: Everlit
description: >-
  Everlit is a B2B SaaS distribution and engagement platform that converts written content
  (articles, blog posts, newsletters) into audio, social video, and podcasts, then auto-distributes
  it. Capabilities include AI text-to-audio with voice cloning across 70+ languages, an embeddable
  audio player and smart playlists, podcast syndication to Apple Podcasts, Spotify and any RSS 2.0 /
  Podcast 2.0 app, social video generation in 16:9, 1:1 and 9:16, programmatic audio monetization
  through Google Ad Manager plus direct sponsorships and house ads, engagement analytics, and CMS
  integration through a native WordPress plugin or a zero-touch JavaScript embed. Customers include
  The Texas Tribune, Hearst Newspapers, the San Francisco Chronicle, Advance Local, Shaw Media and
  Auburn University. Everlit's only publicly reachable machine-readable surfaces are an oEmbed 1.0
  resolver, a player-bootstrap JSON endpoint, and llms.txt / llms-full.txt; the REST API it markets
  for custom CMS integration is undocumented and access-gated through sales.
