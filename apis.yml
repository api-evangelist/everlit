apis:
- name: Everlit oEmbed and Embed Player
  description: >-
    The one Everlit surface an agent or a third-party CMS can call today with no credential and no
    onboarding. GET /oembed resolves an Everlit embed or hosted URL to an oEmbed 1.0 "rich" record
    (title, description, publication, CDN thumbnail and ready-to-paste iframe markup), and
    GET /embeds/{track_id}.json returns the player bootstrap record for an audio article — title,
    publication, duration in milliseconds, cover art, share URL and a signed HLS stream URL.
    Verified live on 2026-08-20; unknown ids return a real 404, so the surface is a genuine
    resolver rather than a catch-all. Everlit publishes no OpenAPI, no reference page and no rate
    limits for it, so this entry is documented from probed responses only.
  humanURL: https://everlit.audio
  baseURL: https://everlit.audio
